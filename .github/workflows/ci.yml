name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CHỈ cache `.next/cache` — bộ nhớ đệm biên dịch của Next (webpack/SWC,
      # tối ưu ảnh). TUYỆT ĐỐI KHÔNG cache cả thư mục `.next`: đó là **kết quả
      # build**, khôi phục lại sẽ khiến job "xanh" bằng output của commit trước
      # thay vì build lại từ mã nguồn hiện tại.
      #
      # Key gồm hash của lockfile + hash toàn bộ mã nguồn: đổi mã nguồn thì key
      # đổi → tạo cache mới; `restore-keys` cho phép dùng lại cache gần nhất của
      # cùng lockfile làm điểm khởi đầu. Cache hỏng/lệch cũng chỉ làm build chậm
      # lại, không làm kết quả sai.
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', '*.ts', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm run lint

      - run: npm test

      # HỢP ĐỒNG BUILD TƯỜNG MINH (AUDIT-M2 / D10).
      #
      # CI cố ý build **KHÔNG có backend**: `NEXT_PUBLIC_API_URL` để rỗng nên
      # `[locale]/layout.tsx` bỏ prerender cả cây `/[locale]` và mọi route render
      # on-demand lúc chạy. Ghi tường minh ở đây thay vì dựa vào việc "tình cờ
      # thiếu biến" — trước đây bước này xanh chỉ vì biến không tồn tại, khiến
      # không ai thấy rằng phần prerender phụ thuộc backend chưa hề được kiểm.
      #
      # Hệ quả phải biết: bước này **không** kiểm được prerender dữ liệu thật.
      # Muốn kiểm thì dựng backend + Postgres rồi build với
      # `NEXT_PUBLIC_API_URL` + `BUILD_REQUIRE_API=1` (xem
      # `docs/07-deployment/deployment-guide.md`). Bộ E2E full-stack
      # (`admin/.github/workflows/e2e-fullstack.yml`) đã phủ đường có backend.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ''
